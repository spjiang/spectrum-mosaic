# 客户部署模板：无源码挂载。许可与数据目录单独挂载。
# 离线包：先 images/load-images.sh，再 compose up（pull_policy: never，禁止悄悄拉仓库）。
name: spectrum-mosaic-customer

services:
  postgres:
    image: postgres:16-alpine
    platform: linux/{{ARCH}}
    pull_policy: never
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mosaic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mosaic_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mosaic_visual}
    volumes:
      # 数据库放在交付包根目录，不放进 data/。data/ 会被改成 worker 的属主。
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mosaic} -d ${POSTGRES_DB:-mosaic_visual}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    platform: linux/{{ARCH}}
    pull_policy: never
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mosaic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-mosaic_secret}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 86400000"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-spectrum-mosaic-backend:{{VERSION}}-{{ARCH}}}
    platform: linux/{{ARCH}}
    pull_policy: never
    # 旧后端镜像没有建目录时的授权。umask 000 保证之后新建的任务目录 worker 能写。
    entrypoint: ["sh", "-c", "umask 000 && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mosaic}:${POSTGRES_PASSWORD:-mosaic_secret}@postgres:5432/${POSTGRES_DB:-mosaic_visual}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mosaic}:${RABBITMQ_PASS:-mosaic_secret}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATA_ROOTS: /data
      # 推扫拼图菜单与接口；须和下面 pushbroom-worker 一起开关（.env 里的 COMPOSE_PROFILES）
      PUSHBROOM_ENABLED: ${PUSHBROOM_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: {{IMAGE_NAME}}
    platform: linux/{{ARCH}}
    pull_policy: never
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mosaic}:${RABBITMQ_PASS:-mosaic_secret}@rabbitmq:5672/
      PYTHONPATH: /app
      MPLBACKEND: Agg
      DATA_ROOTS: /data
      WORKER_STATUS_PATH: /data/.worker/status.json
      MOSAIC_REQUIRE_LICENSE: "1"
      LICENSE_PATH: /license/license.lic
      LICENSE_PUBLIC_KEY_PATH: /app/license_public.pem
      LICENSE_CLOCK_PATH: /data/.license/clock.json
      LICENSE_CLOCK_TOLERANCE_HOURS: "{{LICENSE_CLOCK_TOLERANCE_HOURS}}"
      LICENSE_LEASE_CHECK_INTERVAL_HOURS: "{{LICENSE_LEASE_CHECK_INTERVAL_HOURS}}"
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-{{LICENSE_SERVER_URL}}}
      LICENSE_LEASE_PATH: /data/.license/lease.json
      HOST_MACHINE_ID_PATH: /host/machine-id
    volumes:
      - ./data:/data
      - ./licenses/{{LICENSE_FILE}}:/license/license.lic:ro
      - /etc/machine-id:/host/machine-id:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 推扫高光谱拼图（FigSpec 架次放在 data/input/pushbroom/ 下，一个子目录一个架次）。
  # 只在 .env 里 COMPOSE_PROFILES 含 pushbroom 时启动；与 worker 共用同一份许可。
  pushbroom-worker:
    image: {{PUSHBROOM_IMAGE}}
    platform: linux/{{ARCH}}
    pull_policy: never
    profiles: ["pushbroom"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mosaic}:${RABBITMQ_PASS:-mosaic_secret}@rabbitmq:5672/
      PB_INPUT_ROOTS: /data/input
      PB_OUTPUT_ROOTS: /data/output
      PB_MAX_MEMORY_GB: ${PB_MAX_MEMORY_GB:-8}
      # 本机相机标定，见部署手册「推扫相机标定」；留空用内置 FS-60C 标定
      PB_SENSOR_ALONG_OFFSET_M: ${PB_SENSOR_ALONG_OFFSET_M:-}
      PB_SENSOR_BORESIGHT_PX: ${PB_SENSOR_BORESIGHT_PX:-}
      PB_SENSOR_SAMPLE_SIGN: ${PB_SENSOR_SAMPLE_SIGN:-}
      MOSAIC_REQUIRE_LICENSE: "1"
      LICENSE_PATH: /license/license.lic
      LICENSE_PUBLIC_KEY_PATH: /app/license_public.pem
      LICENSE_CLOCK_PATH: /data/.license/pushbroom-clock.json
      LICENSE_CLOCK_TOLERANCE_HOURS: "{{LICENSE_CLOCK_TOLERANCE_HOURS}}"
      LICENSE_LEASE_CHECK_INTERVAL_HOURS: "{{LICENSE_LEASE_CHECK_INTERVAL_HOURS}}"
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-{{LICENSE_SERVER_URL}}}
      LICENSE_LEASE_PATH: /data/.license/pushbroom-lease.json
      HOST_MACHINE_ID_PATH: /host/machine-id
    volumes:
      - ./data:/data
      - ./licenses/{{LICENSE_FILE}}:/license/license.lic:ro
      - /etc/machine-id:/host/machine-id:ro
    mem_limit: ${PB_MEM_LIMIT:-12g}
    # 停机时会结束正在跑的任务并回报「服务停止」，需要几秒
    stop_grace_period: 30s
    init: true
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-spectrum-mosaic-frontend:{{VERSION}}-{{ARCH}}}
    platform: linux/{{ARCH}}
    pull_policy: never
    ports:
      - "${FRONTEND_PORT:-9080}:80"
    depends_on:
      - backend
